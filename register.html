<link rel="stylesheet" href="/static/style.css">

<div class="navbar">
    <a href="/">Home</a>
    <a href="/register">Register</a>
    <a href="/login">Login</a>
    <a href="/admin_login">Admin</a>
</div>

<div class="page-shell">
    <div class="card form-box">
        <div>
            <h1 class="form-title">Create Your Voter Profile</h1>
            <p class="form-subtitle">Register quickly and securely to participate in the election.</p>
        </div>

        <form method="post">
            <div class="form-group">
                <input name="name" placeholder="Name" required>
                <input name="phone" placeholder="Phone" required>
                <input name="aadhaar" placeholder="Aadhaar" required>
                <input name="email" type="email" placeholder="Email" required>
                <input name="password" type="password" placeholder="Password" required>
            </div>
            <button class="primary" type="submit">Register</button>
        </form>
    </div>
</div>
